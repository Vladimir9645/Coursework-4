<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Coursework_4{% endblock %}</title>
    <!-- Bootstrap для быстрого вида -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Coursework: рассылки</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/clients/">Получатели</a>
                <a class="nav-link" href="/mail_templates/">Шаблоны писем</a>
                <a class="nav-link" href="/mailings/">Рассылки</a>
                <a class="nav-link" href="/accounts/login/">Вход</a>
                <a class="nav-link" href="/admin/">Админка</a>
            </div>
        </div>
    </nav>

    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
